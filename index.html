<div class="card telemetry-card">
  <h3>⚡ Launch Velocity Telemetry</h3>
  <div id="engine-status" class="status-badge connecting">Connecting to engine...</div>
  <ul class="telemetry-stats">
    <li>Database: <span id="db-state">Checking...</span></li>
    <li>Server Time: <span id="server-time">--</span></li>
  </ul>
</div>

<script>
  async function fetchTelemetry() {
    try {
      const res = await fetch('/api/telemetry');
      const data = await res.json();
      
      if (data.status === 'online') {
        const badge = document.getElementById('engine-status');
        badge.textContent = 'System Online & Stable';
        badge.className = 'status-badge online';
        
        document.getElementById('db-state').textContent = 'Connected (PostgreSQL)';
        document.getElementById('server-time').textContent = new Date(data.serverTime).toLocaleTimeString();
      }
    } catch (err) {
      const badge = document.getElementById('engine-status');
      badge.textContent = 'Connection Error';
      badge.className = 'status-badge error';
    }
  }

  // Initial fetch and poll every 5 seconds
  fetchTelemetry();
  setInterval(fetchTelemetry, 5000);
</script>
