<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitlist Signup</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, select, button { width: 100%; padding: 0.75rem; margin-top: 1rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { background: #3b82f6; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Join the Waitlist</h2>
    
    <!-- Step 1: Signup Form -->
    <form id="signupForm" onsubmit="handleSignup(event)">
        <label for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required>
        <button type="submit">Request Verification Code</button>
    </form>

    <!-- Step 2: Verification Form (Hidden Initially) -->
    <form id="verifyForm" class="hidden" onsubmit="handleVerify(event)">
        <p style="font-size: 0.9rem; color: #94a3b8;">Enter the code sent to your email and select your tier.</p>
        <label for="verifyCode">Verification Code</label>
        <input type="text" id="verifyCode" placeholder="123456" required>
        
        <label for="tierLevel">Select Tier</label>
        <select id="tierLevel">
            <option value="1">Tier 1 - Standard</option>
            <option value="2">Tier 2 - Pro</option>
            <option value="3">Tier 3 - Enterprise</option>
        </select>

        <button type="submit">Verify & Join</button>
    </form>
</div>

<script>
    const API_BASE = 'https://revenue-engine-dc8d.onrender.com/api';
    let userEmail = '';

    // 1. Request verification code
    async function handleSignup(event) {
        event.preventDefault();
        userEmail = document.getElementById('signupEmail').value;

        try {
            const response = await fetch(`${API_BASE}/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail })
            });

            const data = await response.json();
            if (response.ok) {
                alert('Verification code sent! Check your inbox.');
                document.getElementById('signupForm').classList.add('hidden');
                document.getElementById('verifyForm').classList.remove('hidden');
            } else {
                alert(data.error || 'Signup failed');
            }
        } catch (err) {
            console.error('Network Error:', err);
            alert('Could not connect to the server.');
        }
    }

    // 2. Verify code and finalize tier placement
    async function handleVerify(event) {
        event.preventDefault();
        const code = document.getElementById('verifyCode').value;
        const tierLevel = document.getElementById('tierLevel').value;

        try {
            const response = await fetch(`${API_BASE}/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail, code, tierLevel })
            });

            const data = await response.json();
            if (response.ok) {
                alert(`Success! You have been added to the waitlist.`);
                // Reset or redirect here
            } else {
                alert(data.error || 'Verification failed');
            }
        } catch (err) {
            console.error('Network Error:', err);
            alert('Could not connect to the server.');
        }
    }
</script>

</body>
</html>
