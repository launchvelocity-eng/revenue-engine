<div class="tier-selection-container">
  <h3>Select Your Access Tier</h3>
  <form id="tierForm">
    <input type="email" id="userEmail" placeholder="Enter your email" required />
    
    <select id="tierLevel" required>
      <option value="1">Tier 1: Free Public Access / Waitlist</option>
      <option value="2">Tier 2: Basic Engagement</option>
      <option value="3">Tier 3: Standard Prosumer</option>
      <option value="4">Tier 4: Advanced Professional</option>
      <option value="5">Tier 5: Enterprise / VIP</option>
    </select>

    <button type="submit">Join / Upgrade</button>
  </form>
</div>

<script>
  document.getElementById('tierForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('userEmail').value;
    const tierLevel = parseInt(document.getElementById('tierLevel').value);

    const response = await fetch('https://revenue-engine-dc8d.onrender.com/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, tierLevel })
    });

    const data = await response.json();
    if (data.success) {
      alert('Check your email for your verification code!');
    } else {
      alert('Error: ' + data.error);
    }
  });
</script>
