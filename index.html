<script>
  const ENGINE_URL = 'https://revenue-engine-dc8d.onrender.com';

  async function syncLaunchVelocityEngine() {
    try {
      const response = await fetch(`${ENGINE_URL}/api/v1/telemetry`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          'x-tenant-id': 'enterprise-default'
        }
      });

      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();

      // Update live status indicators if matching elements exist
      console.log('[Launch Velocity] Live Engine Synced:', data);
      const statusBadges = document.querySelectorAll('[data-engine-sync]');
      statusBadges.forEach(el => {
        const key = el.getAttribute('data-engine-sync');
        if (data[key] !== undefined) el.textContent = data[key];
      });
    } catch (err) {
      console.warn('[Launch Velocity] Engine waking up or unreachable:', err.message);
    }
  }

  document.addEventListener('DOMContentLoaded', syncLaunchVelocityEngine);
</script>
