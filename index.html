<div class="card telemetry-widget">
  <h3>⚡ Launch Velocity Telemetry</h3>
  <div id="system-status" class="status-badge connecting">Connecting to engine...</div>
  <ul class="metrics-list">
    <li>Database Connection: <span id="db-status">Checking...</span></li>
    <li>Lease Worker: <span id="lease-status">Active</span></li>
    <li>Declutter Assistant: <span id="declutter-status">Active</span></li>
  </ul>
</div>

<script>
  async function fetchTelemetry() {
    try {
      const res = await fetch('/api/telemetry');
      const data = await res.json();
      
      if (data.status === 'online') {
        document.getElementById('system-status').textContent = 'System Online & Stable';
        document.getElementById('system-status').className = 'status-badge online';
        document.getElementById('db-status').textContent = 'Connected (PostgreSQL)';
      }
    } catch (err) {
      document.getElementById('system-status').textContent = 'Connection Error';
      document.getElementById('system-status').className = 'status-badge error';
    }
  }

  // Poll every 5 seconds for real-time telemetry
  fetchTelemetry();
  setInterval(fetchTelemetry, 5000);
</script>
