<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launch Velocity | Enterprise Vault Portal</title>
  <style>
    :root {
      --bg-dark: #06090e;
      --panel-bg: #0f141d;
      --border-color: #1e293b;
      --border-glow: #38bdf8;
      --accent-blue: #38bdf8;
      --accent-cyan: #22d3ee;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 36px;
      background: rgba(15, 20, 29, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .auth-stage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1;
      padding: 60px 20px;
    }
    .auth-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: var(--accent-cyan);
      border-bottom-color: var(--accent-cyan);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .form-group label {
      font-size: 0.78rem;
      color: var(--accent-cyan);
      font-weight: 700;
      text-transform: uppercase;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      background: #080c14;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan)); color: #040914; }
    .btn-success { background: var(--accent-green); color: #040914; }
    .btn-danger { background: var(--accent-red); color: #ffffff; }
    .btn-secondary { background: #1e293b; color: var(--text-main); margin-top: 10px; }

    .dashboard-stage {
      padding: 40px 32px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 28px;
    }
    .dashboard-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 28px;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
    }

    .meter-container {
      background: #080c14;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      width: 28%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
    }

    .price-output {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent-green);
      margin-top: 8px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="brand-logo">
      <span>⚡ Launch Velocity</span>
    </div>
    <div id="nav-user-info" class="hidden">
      <span id="display-username" style="color: var(--text-muted); margin-right: 16px; font-weight: 600;"></span>
      <button onclick="handleLogout()" class="btn btn-danger" style="width: auto; padding: 8px 18px;">Sign Out</button>
    </div>
  </header>

  <!-- STAGE 1: SIGN IN / SIGN UP / RECOVERY -->
  <main id="stage-auth" class="auth-stage">
    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tab-signin" class="tab-btn active" onclick="switchAuthTab('signin')">Sign In</button>
        <button id="tab-signup" class="tab-btn" onclick="switchAuthTab('signup')">Sign Up</button>
      </div>

      <!-- Sign In Form -->
      <form id="form-signin" onsubmit="handleAuthSubmit(event, 'signin')">
        <div class="form-group">
          <label for="signin-username">Enterprise Username</label>
          <input type="text" id="signin-username" required placeholder="corporate_admin" />
        </div>
        <div class="form-group">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" required placeholder="••••••••••••" />
        </div>
        <button type="submit" class="btn btn-primary">Authenticate Vault Node</button>
        <button type="button" onclick="triggerRecovery()" class="btn btn-secondary">Forgot Username / Password?</button>
      </form>

      <!-- Detailed Sign Up Form -->
      <form id="form-signup" class="hidden" onsubmit="handleAuthSubmit(event, 'signup')">
        <div class="form-row">
          <div class="form-group">
            <label for="signup-firstname">First Name</label>
            <input type="text" id="signup-firstname" required placeholder="Alfredo" />
          </div>
          <div class="form-group">
            <label for="signup-lastname">Last Name</label>
            <input type="text" id="signup-lastname" required placeholder="Monge" />
          </div>
        </div>
        <div class="form-group">
          <label for="signup-enterprise">Business / Corporation Name</label>
          <input type="text" id="signup-enterprise" required placeholder="Launch Velocity Corp" />
        </div>
        <div class="form-group">
          <label for="signup-email">Enterprise Email</label>
          <input type="email" id="signup-email" required placeholder="mongealfredoantonio@gmail.com" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="signup-username">Desired Username</label>
            <input type="text" id="signup-username" required placeholder="monge_eng" />
          </div>
          <div class="form-group">
            <label for="signup-password">Secure Password</label>
            <input type="password" id="signup-password" required placeholder="••••••••••••" />
          </div>
        </div>
        <button type="submit" class="btn btn-success" style="margin-top: 10px;">Register & Proceed to Sign In</button>
      </form>
    </div>
  </main>

  <!-- STAGE 2: LOGGED-IN TENANT DASHBOARD -->
  <main id="stage-dashboard" class="dashboard-stage hidden">

    <!-- Active Storage Meter -->
    <section class="dashboard-card" style="grid-column: 1 / -1;">
      <div class="card-title">
        <span>📊 Active Storage Allocation & Utilization</span>
        <span style="color: var(--accent-green); font-size: 0.9rem;">● Secure Vault Online</span>
      </div>
      <div class="meter-container">
        <div style="display: flex; justify-content: space-between; font-weight: 600;">
          <span>Allocated Storage: <strong id="allocated-tb-display">1 TB (Base Tier)</strong></span>
          <span>Used: <strong>0.28 TB (28%)</strong> | Available: <strong id="available-tb-display">0.72 TB</strong></span>
        </div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
      </div>
    </section>

    <!-- Pricing Matrix, Custom Scaling & Key Quantity Options -->
    <section class="dashboard-card">
      <div class="card-title">
        <span>💳 Storage Tiers & Key Dispatch</span>
      </div>
      
      <div class="form-group">
        <label for="tier-select">Select Storage Tier</label>
        <select id="tier-select" onchange="calculateTotal()">
          <option value="base">Base Tier (1 TB Included) — $2,500/mo</option>
          <option value="growth">Growth Tier (5 TB Included) — $3,500/mo</option>
          <option value="enterprise">Enterprise Tier (10 TB Included) — $4,750/mo</option>
        </select>
      </div>

      <div class="form-group">
        <label for="add-tb">Add Extra Capacity ($250 / mo per TB)</label>
        <input type="number" id="add-tb" value="0" min="0" max="100" oninput="calculateTotal()" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="lease-months">Lease Length / Add Months</label>
          <select id="lease-months" onchange="calculateTotal()">
            <option value="1">1 Month (Standard)</option>
            <option value="6">6 Months (10% Discount)</option>
            <option value="12">12 Months (20% Discount)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="key-count">Client Access Keys (1-3)</label>
          <select id="key-count">
            <option value="1">1 Key (Standard)</option>
            <option value="2">2 Keys (Dual Admin)</option>
            <option value="3">3 Keys (Multi-Node)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="payment-method">Encrypted Payment Transfer Method</label>
        <select id="payment-method">
          <option value="Card">Credit / Debit Card (Encrypted Gateway)</option>
          <option value="ACH">ACH Direct Bank Transfer</option>
          <option value="MobilePay">Cash App / PayPal / Google Wallet</option>
        </select>
      </div>

      <div class="price-output" id="checkout-total-display">$2,500 Total</div>
      <button onclick="executeVaultPurchase()" class="btn btn-success" style="margin-top: 12px;">Process Payment & Email Keys</button>
    </section>

    <!-- Active Gatekeeper Keys & File Operations -->
    <section class="dashboard-card">
      <div class="card-title">
        <span>🔐 Active Vault Access Keys</span>
      </div>
      <div class="form-group">
        <label>Assigned Access Key 1</label>
        <input type="text" id="key-1" readonly value="gkq_client_1_Pending..." />
      </div>
      <div class="form-group">
        <label>Assigned Access Key 2</label>
        <input type="text" id="key-2" readonly value="N/A (Select 2-3 keys)" />
      </div>
      <div class="form-group">
        <label>Withdraw / Upload Files</label>
        <input type="file" id="data-file-input" />
      </div>
      <button onclick="alert('Payload successfully transferred through secure vault pipe.')" class="btn btn-primary">Execute Data Transfer</button>
    </section>

    <!-- Admin Support, Termination & File Return Escalation -->
    <section class="dashboard-card" style="grid-column: 1 / -1;">
      <div class="card-title">
        <span>🚨 Contact Launch Velocity Admin</span>
      </div>
      <form onsubmit="handleAdminAlert(event)">
        <div class="form-group">
          <label for="alert-type">Support / Action Request Type</label>
          <select id="alert-type">
            <option value="question">General Technical Inquiry</option>
            <option value="payment">Payment Transfer / Billing Assistance</option>
            <option value="filereturn">Request File Return / Backup Export</option>
            <option value="termination">Initiate Rented Storage Termination</option>
          </select>
        </div>
        <div class="form-group">
          <label for="alert-notes">Message / Details</label>
          <textarea id="alert-notes" rows="3" required placeholder="Provide details for administration..."></textarea>
        </div>
        <button type="submit" class="btn btn-danger" style="width: auto; padding: 12px 28px;">Dispatch Admin Alert</button>
      </form>
    </section>

  </main>

  <script>
    const ENGINE_URL = 'https://revenue-engine-ds6d.onrender.com';

    function switchAuthTab(tab) {
      document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      document.getElementById('form-signin').classList.toggle('hidden', tab !== 'signin');
      document.getElementById('form-signup').classList.toggle('hidden', tab !== 'signup');
    }

    async function handleAuthSubmit(event, type) {
      event.preventDefault();
      if (type === 'signup') {
        const firstName = document.getElementById('signup-firstname').value;
        const lastName = document.getElementById('signup-lastname').value;
        const enterpriseName = document.getElementById('signup-enterprise').value;
        const email = document.getElementById('signup-email').value;
        const username = document.getElementById('signup-username').value;
        const password = document.getElementById('signup-password').value;

        try {
          await fetch(`${ENGINE_URL}/api/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ firstName, lastName, enterpriseName, email, username, password })
          });
        } catch (e) {}

        alert(`Account successfully registered for ${enterpriseName}! Redirecting to Sign In.`);
        switchAuthTab('signin');
      } else {
        const username = document.getElementById('signin-username').value;
        sessionStorage.setItem('vault_user', username);
        sessionStorage.setItem('vault_user_email', 'mongealfredoantonio@gmail.com');
        loadDashboard();
      }
    }

    async function triggerRecovery() {
      const email = prompt('Enter your registered enterprise email address for username & password recovery:');
      if (!email) return;

      try {
        await fetch(`${ENGINE_URL}/api/auth/recover`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
      } catch (e) {}

      alert(`Recovery credentials and username dispatched to ${email}.`);
    }

    function loadDashboard() {
      const username = sessionStorage.getItem('vault_user');
      if (!username) return;

      document.getElementById('stage-auth').classList.add('hidden');
      document.getElementById('stage-dashboard').classList.remove('hidden');
      document.getElementById('nav-user-info').classList.remove('hidden');
      document.getElementById('display-username').textContent = `Tenant: @${username}`;

      calculateTotal();
    }

    function handleLogout() {
      sessionStorage.clear();
      document.getElementById('stage-dashboard').classList.add('hidden');
      document.getElementById('nav-user-info').classList.add('hidden');
      document.getElementById('stage-auth').classList.remove('hidden');
    }

    function calculateTotal() {
      const tier = document.getElementById('tier-select').value;
      const addTB = parseInt(document.getElementById('add-tb').value, 10) || 0;
      const months = parseInt(document.getElementById('lease-months').value, 10) || 1;

      let baseCost = 2500;
      let initialTB = 1;

      if (tier === 'growth') { baseCost = 3500; initialTB = 5; }
      if (tier === 'enterprise') { baseCost = 4750; initialTB = 10; }

      const totalTB = initialTB + addTB;
      let monthlyRate = baseCost + (addTB * 250);

      let discount = 1.0;
      if (months === 6) discount = 0.9;
      if (months === 12) discount = 0.8;

      const grandTotal = Math.round(monthlyRate * months * discount);

      document.getElementById('checkout-total-display').textContent = `$${grandTotal.toLocaleString()} Total (${months} mo)`;
      document.getElementById('allocated-tb-display').textContent = `${totalTB} TB (${document.getElementById('tier-select').selectedOptions[0].text.split('—')[0]})`;
      document.getElementById('available-tb-display').textContent = `${(totalTB - 0.28).toFixed(2)} TB`;
    }

    async function executeVaultPurchase() {
      const username = sessionStorage.getItem('vault_user');
      const userEmail = sessionStorage.getItem('vault_user_email');
      const method = document.getElementById('payment-method').value;
      const tierName = document.getElementById('tier-select').selectedOptions[0].text;
      const keyCount = parseInt(document.getElementById('key-count').value, 10);
      const totalAmount = document.getElementById('checkout-total-display').textContent;

      try {
        const res = await fetch(`${ENGINE_URL}/api/vault/checkout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username,
            enterpriseName: 'Launch Velocity Enterprise',
            userEmail,
            tierName,
            tbCount: document.getElementById('allocated-tb-display').textContent,
            months: document.getElementById('lease-months').value,
            keyCount,
            paymentMethod: method,
            totalAmount
          })
        });
        const data = await res.json();
        if (data.clientKeys) {
          document.getElementById('key-1').value = data.clientKeys[0] || 'N/A';
          document.getElementById('key-2').value = data.clientKeys[1] || 'N/A (Single Key Issued)';
        }
      } catch (err) {}

      alert(`Payment of ${totalAmount} successful! ${keyCount} vault key(s) have been emailed to you. (Admin master backup keys securely dispatched to Launch Velocity administration).`);
    }

    async function handleAdminAlert(event) {
      event.preventDefault();
      const category = document.getElementById('alert-type').value;
      const notes = document.getElementById('alert-notes').value;
      const username = sessionStorage.getItem('vault_user');

      try {
        await fetch(`${ENGINE_URL}/api/admin/alert`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, category, notes })
        });
      } catch (err) {}

      alert('Ticket dispatched to Launch Velocity admin (mongealfredoantonio@gmail.com).');
      document.getElementById('alert-notes').value = '';
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('vault_user')) {
        loadDashboard();
      }
    });
  </script>
</body>
</html>
