<div class="verification-container" style="margin-top: 20px;">
  <h3>Enter Verification Code</h3>
  <form id="verifyForm">
    <input type="email" id="verifyEmail" placeholder="Confirm your email" required />
    <input type="text" id="verifyCode" placeholder="6-digit code" required />
    <select id="confirmTierLevel" required>
      <option value="1">Tier 1</option>
      <option value="2">Tier 2</option>
      <option value="3">Tier 3</option>
      <option value="4">Tier 4</option>
      <option value="5">Tier 5</option>
    </select>
    <button type="submit">Verify & Activate Tier</button>
  </form>
</div>

<script>
  document.getElementById('verifyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('verifyEmail').value;
    const code = document.getElementById('verifyCode').value;
    const tierLevel = parseInt(document.getElementById('confirmTierLevel').value);

    const response = await fetch('https://revenue-engine-dc8d.onrender.com/api/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, code, tierLevel })
    });

    const data = await response.json();
    if (data.success) {
      alert('Success! Your account is verified and assigned to Tier ' + data.assignedTier);
    } else {
      alert('Verification failed: ' + data.error);
    }
  });
</script>
