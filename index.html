      <!-- Sign In Form Panel -->
      <section class="form-panel active" id="signInPanel">
        <form id="signInForm">
          <div class="form-group">
            <label for="signinUsername">Enterprise Username</label>
            <input type="text" id="signinUsername" placeholder="e.g. corporate_admin" required>
          </div>
          <div class="form-group">
            <label for="signinPassword">Password</label>
            <input type="password" id="signinPassword" placeholder="••••••••••••" required>
          </div>
          <button type="submit" class="btn-submit btn-signin">Authenticate Vault Node</button>
        </form>
      </section>

      <!-- Sign Up Form Panel -->
      <section class="form-panel" id="signUpPanel">
        <form id="signUpForm">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" placeholder="First Name" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" placeholder="Last Name" required>
            </div>
          </div>
          <div class="form-group">
            <label for="corpName">Business / Corporation Name</label>
            <input type="text" id="corpName" placeholder="Company Name" required>
          </div>
          <div class="form-group">
            <label for="enterpriseEmail">Enterprise Email</label>
            <input type="email" id="enterpriseEmail" placeholder="name@company.com" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="signupUsername">Desired Username</label>
              <input type="text" id="signupUsername" placeholder="Username" required>
            </div>
            <div class="form-group">
              <label for="signupPassword">Secure Password</label>
              <input type="password" id="signupPassword" placeholder="••••••••••••" required>
            </div>
          </div>
          <button type="submit" class="btn-submit btn-signup">Register & Proceed to Dashboard</button>
        </form>
      </section>
