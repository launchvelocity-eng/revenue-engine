  <script>
    const API_BASE_URL = 'https://revenue-engine-ds8d.onrender.com';
    const HARDWARE_KEY = 'LV-KEY-B826EA2203EAACCA';

    function updateTier() {
      const sel = document.getElementById('tierSelect');
      const opt = sel.options[sel.selectedIndex];
      document.getElementById('priceDisplay').innerHTML = opt.dataset.price + '<span>/mo</span>';
      document.getElementById('vaultDisplay').innerHTML = '2.8 TB <span>/ ' + opt.dataset.vault + '</span>';
    }

    async function authorizeSettlement() {
      const btn = document.getElementById('settleBtn');
      const tier = document.getElementById('tierSelect').value;

      btn.disabled = true;
      btn.textContent = 'Establishing Secure Gateway...';

      try {
        const res = await fetch(`${API_BASE_URL}/api/v1/create-checkout-session`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-hardware-key': HARDWARE_KEY,
            'x-tenant-id': 'enterprise-default',
          },
          body: JSON.stringify({ tier }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || `Request failed (${res.status})`);
        }

        btn.textContent = `Authorized (${data.allocatedVault}) // Ready`;
        btn.style.background = '#10b981';
      } catch (err) {
        console.error('Settlement error:', err);
        btn.textContent = 'Gateway Retry // Check CORS or Logs';
        btn.style.background = '#e11d48';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
