<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launch Velocity</title>
<style>
body{font-family:sans-serif;background:#090d16;color:#f8fafc;padding:2rem 1rem;text-align:center;margin:0}
.wrap{max-width:960px;margin:0 auto}
input{width:100%;max-width:340px;padding:.75rem;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;margin:1rem 0 2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem;text-align:left}
.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:1.5rem}
.price{font-size:2rem;font-weight:700;margin:.5rem 0}
button{width:100%;padding:.8rem;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;margin-top:1rem;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>Launch Velocity</h1>
  <p style="color:#94a3b8">Automated revenue infrastructure and secure digital storage.</p>
  <input type="email" id="email" placeholder="Enter account email (optional)">
  <div class="grid">
    <div class="card"><h3>Starter Engine</h3><div class="price">$199/mo</div><p>Core Storage &amp; Automated Verification</p><button onclick="go('starter',this)">Deploy Starter</button></div>
    <div class="card"><h3>Growth Suite</h3><div class="price">$499/mo</div><p>High-Speed Storage &amp; Priority Routing</p><button onclick="go('growth',this)">Deploy Growth</button></div>
    <div class="card"><h3>Enterprise Core</h3><div class="price">$999/mo</div><p>Dedicated Capacity &amp; Custom Retention</p><button onclick="go('enterprise',this)">Deploy Enterprise</button></div>
  </div>
</div>
<script>
const API='https://revenue-engine-de8d.onrender.com';
fetch(API+'/health').catch(()=>{});
async function go(tierId,btn){
  const t=btn.textContent;btn.disabled=true;btn.textContent='Connecting...';
  try{
    const r=await fetch(API+'/api/billing/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tierId,customerEmail:document.getElementById('email').value.trim()})});
    const d=await r.json();
    if(d.checkoutUrl)location.href=d.checkoutUrl;else{alert(d.error||'Error');btn.disabled=false;btn.textContent=t;}
  }catch(e){alert('Server waking up—tap again in 30s.');btn.disabled=false;btn.textContent=t;}
}
</script>
</body>
</html>
