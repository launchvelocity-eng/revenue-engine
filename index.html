<!-- Gatekeeper Key Configuration Modal -->
<div id="gatekeeperModal" class="modal-backdrop hidden">
  <div class="modal-card">
    <div class="modal-header">
      <span class="cyber-badge">SECURITY PROTOCOL</span>
      <h3>Vault Gatekeeper Authentication</h3>
    </div>
    <p class="modal-subtext">
      Enter your enterprise vault key (<code>X-Vault-Gatekeeper-Key</code>) to authorize encrypted streaming transfers.
    </p>
    <div class="input-group">
      <label for="gatekeeperKeyInput">GATEKEEPER KEY</label>
      <input 
        type="password" 
        id="gatekeeperKeyInput" 
        placeholder="vlt_live_xxxxxxxxxxxxxxxx" 
        autocomplete="off"
      />
    </div>
    <div class="modal-actions">
      <button id="saveGatekeeperKeyBtn" class="btn-primary">SAVE & AUTHORIZE</button>
      <button id="clearGatekeeperKeyBtn" class="btn-secondary">CLEAR KEY</button>
    </div>
    <div id="authStatusMessage" class="auth-status-msg"></div>
  </div>
</div>
