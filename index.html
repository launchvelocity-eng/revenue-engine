<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Waitlist</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; padding: 32px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    input[type="email"] { width: 100%; padding: 12px; margin: 16px 0; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: #fff; font-size: 1rem; }
    button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    button:disabled { opacity: 0.6; }
    #status { margin-top: 16px; font-size: 0.9rem; word-break: break-word; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Revenue-Engine</h1>
    <p>Sign up to get early access.</p>
    <form id="waitlistForm">
      <input type="email" id="emailInput" placeholder="Enter your email" required />
      <button type="submit" id="submitBtn">Join Waitlist</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    const API_URL = 'https://revenue-engine-dc8d.onrender.com/api/execute';
    const form = document.getElementById('waitlistForm');
    const emailInput = document.getElementById('emailInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.className = '';
      statusDiv.textContent = 'Submitting...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value })
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          statusDiv.className = 'success';
          statusDiv.textContent = 'Awesome! You are on the waitlist.';
          emailInput.value = '';
        } else {
          statusDiv.className = 'error';
          statusDiv.textContent = data.error || data.details || 'Submission failed.';
        }
      } catch (err) {
        statusDiv.className = 'error';
        statusDiv.textContent = 'Network connection error. Please try again.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
