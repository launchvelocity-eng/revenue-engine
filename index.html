<script>
  // Replace with your actual Render service URL (e.g., https://revenue-engine.onrender.com)
  const RENDER_BACKEND_URL = 'https://YOUR-RENDER-SERVICE-NAME.onrender.com';

  // Silent pre-warm ping to wake up Render free instance immediately upon page load
  window.addEventListener('DOMContentLoaded', () => {
    fetch(`${RENDER_BACKEND_URL}/health`, { method: 'GET' }).catch(() => {});
  });

  async function handleCheckout(tierId, customerEmail = '') {
    try {
      const response = await fetch(`${RENDER_BACKEND_URL}/api/billing/create-checkout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tierId, customerEmail })
      });

      if (!response.ok) {
        const errorText = await response.text();
        console.error(`HTTP Error Status: ${response.status}`, errorText);
        alert('Failed to connect to backend API. Check Render dashboard.');
        return;
      }

      const data = await response.json();
      if (data.checkoutUrl) {
        window.location.href = data.checkoutUrl;
      } else {
        console.error('Invalid response payload:', data);
        alert('Checkout URL not returned from server.');
      }
    } catch (err) {
      console.error('Network or fetch connection error:', err);
      alert('Failed to connect to backend API. Check Render dashboard.');
    }
  }

  // Example binding to your tier buttons:
  // document.getElementById('starter-btn').addEventListener('click', () => handleCheckout('starter'));
  // document.getElementById('growth-btn').addEventListener('click', () => handleCheckout('growth'));
  // document.getElementById('enterprise-btn').addEventListener('click', () => handleCheckout('enterprise'));
</script>
