<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Velocity | Revenue-Engine Access</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1a2332 0%, #0d1117 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .hero-card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .brand-emblem {
            width: 70px;
            height: 70px;
            margin: 0 auto 1.5rem auto;
            background: linear-gradient(135deg, #0969da, #2ea043);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(9, 105, 218, 0.35);
        }
        .brand-emblem svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }
        .hero-card h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(180deg, #ffffff 0%, #8b949e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #58a6ff;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .description {
            font-size: 0.95rem;
            color: #8b949e;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        input[type="email"]:focus {
            border-color: #58a6ff;
        }
        button.btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #238636, #2ea043);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        #status-msg {
            margin-top: 1rem;
            font-size: 14px;
            color: #8b949e;
            min-height: 20px;
        }

        .modal-overlay {

            position: fixed;

            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
