<html lang="en">
<head>

  <title>Launch Velocity — Revenue Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0f17;
      color: #f4f7fb;
      position: relative;
      overflow-x: hidden;
    }
    .bg-lock-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.22;
    }
    .bg-lock-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 6px; }
    .sub { color: #a7b3c7; margin-bottom: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: rgba(18, 25, 38, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 20px;
    }
    .price { font-size: 1.5rem; font-weight: 700; margin: 10px 0 16px; color: #4ade80; }
    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }
