<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Tiered Storage</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: auto; }
        .tier-card { background: #1e293b; border: 1px solid #334155; padding: 20px; margin-bottom: 15px; border-radius: 8px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2563eb; }
        input, select { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Secure Storage Tiers</h1>
    <div id="tiers-container">Loading storage tiers...</div>

    <h2>Register / Select Tier</h2>
    <form id="tier-form">
        <input type="email" id="email" placeholder="Enter your email" required>
        <select id="tier-select">
            <option value="">Select a Tier</option>
        </select>
        <button type="submit">Register for Tier</button>
    </form>
    <p id="response-msg"></p>

    <script>
        const API_URL = 'https://revenue-engine-dc8d.onrender.com';

        // Fetch and render tiers dynamically
        fetch(`${API_URL}/api/tiers`)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('tiers-container');
                const select = document.getElementById('tier-select');
                container.innerHTML = '';
                
                data.tiers.forEach(tier => {
                    // Render card
                    const card = document.createElement('div');
                    card.className = 'tier-card';
                    card.innerHTML = `
                        <h3>${tier.tier_name}</h3>
                        <p><strong>Price:</strong> $${tier.price_monthly}/month</p>
                        <p><strong>Storage:</strong> ${tier.storage_gb} GB</p>
                        <p><strong>Retention:</strong> ${tier.retention_days} Days</p>
                        <p><strong>Security:</strong> ${tier.security_level}</p>
                    `;
                    container.appendChild(card);

                    // Add to dropdown
                    const option = document.createElement('option');
                    option.value = tier.tier_name;
                    option.textContent = `${tier.tier_name} ($${tier.price_monthly}/mo)`;
                    select.appendChild(option);
                });
            })
            .catch(err => {
                document.getElementById('tiers-container').textContent = 'Failed to load tiers.';
            });

        // Handle tier selection
        document.getElementById('tier-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const tierName = document.getElementById('tier-select').value;
            const msg = document.getElementById('response-msg');

            msg.textContent = 'Processing registration...';

            try {
                const res = await fetch(`${API_URL}/api/select-tier`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, tierName })
                });
                const result = await res.json();
                if (result.success) {
                    msg.textContent = result.message;
                } else {
                    msg.textContent = result.error || 'Registration failed.';
                }
            } catch (err) {
                msg.textContent = 'Error connecting to server.';
            }
        });
    </script>
</body>
</html>
