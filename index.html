<!-- Gatekeeper Authentication Trigger & Status Bar -->
<div id="gatekeeper-bar" class="gatekeeper-bar">
  <div class="status-indicator">
    <span id="gatekeeper-badge" class="badge locked">🔒 Gatekeeper Unauthenticated</span>
    <span id="active-tenant-display" class="tenant-label">Session Key: None</span>
  </div>
  <button id="open-auth-modal-btn" class="btn btn-secondary">Manage Vault Key</button>
</div>

<!-- Secure Gatekeeper Authentication UI Modal -->
<div id="auth-modal-overlay" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h3>🔐 Corporate Gatekeeper Authentication</h3>
      <button id="close-auth-modal-btn" class="close-btn">&times;</button>
    </div>
    
    <div class="modal-body">
      <p class="modal-description">
        Enter your enterprise validation key below. The key is securely cached in your browser's session storage and dynamically injected as <code>X-Vault-Gatekeeper-Key</code> for raw payload uploads and telemetry sync.
      </p>

      <form id="gatekeeper-form" onsubmit="return false;">
        <div class="form-group">
          <label for="gatekeeper-key-input">X-Vault-Gatekeeper-Key</label>
          <input 
            type="password" 
            id="gatekeeper-key-input" 
            placeholder="e.g. gkq_live_99f28a38b10..." 
            autocomplete="off"
            required
          />
        </div>

        <div id="auth-feedback" class="feedback-msg hidden"></div>

        <div class="modal-actions">
          <button type="button" id="clear-key-btn" class="btn btn-danger">Clear Key</button>
          <button type="submit" id="save-key-btn" class="btn btn-primary">Authenticate & Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
