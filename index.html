<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaunchVelocity — Join the Waitlist</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2563eb; }
        .hidden { display: none; }
        #message { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>LaunchVelocity</h2>
        <p>Join the exclusive waitlist.</p>

        <!-- Step 1: Email Form -->
        <div id="step-email">
            <input type="email" id="emailInput" placeholder="Enter your email address" required>
            <button onclick="requestVerification()">Get Verification Code</button>
        </div>

        <!-- Step 2: Code Verification Form (Initially Hidden) -->
        <div id="step-code" class="hidden">
            <p style="font-size: 13px; color: #94a3b8;">Enter the 6-digit code sent to your email.</p>
            <input type="text" id="codeInput" placeholder="Enter 6-digit code" maxlength="6">
            <button onclick="confirmVerification()">Verify & Join</button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        const BACKEND_URL = 'https://revenue-engine-dc8d.onrender.com'; // Your live Render URL
        let savedEmail = '';

        async function requestVerification() {
            const email = document.getElementById('emailInput').value;
            const messageDiv = document.getElementById('message');

            if (!email) {
                messageDiv.style.color = '#f87171';
                messageDiv.innerText = 'Please enter a valid email.';
                return;
            }

            savedEmail = email;
            messageDiv.style.color = '#94a3b8';
            messageDiv.innerText = 'Sending verification code...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.style.color = '#4ade80';
                    messageDiv.innerText = data.message;
                    // Switch views to show code input box
                    document.getElementById('step-email').classList.add('hidden');
                    document.getElementById('step-code').classList.remove('hidden');
                } else {
                    messageDiv.style.color = '#f87171';
                    messageDiv.innerText = data.error || 'Something went wrong.';
                }
            } catch (err) {
                messageDiv.style.color = '#f87171';
                messageDiv.innerText = 'Connection error. Try again.';
            }
        }

        async function confirmVerification() {
            const code = document.getElementById('codeInput').value;
            const messageDiv = document.getElementById('message');

            if (!code || code.length !== 6) {
                messageDiv.style.color = '#f87171';
                messageDiv.innerText = 'Please enter the valid 6-digit code.';
                return;
            }

            messageDiv.style.color = '#94a3b8';
            messageDiv.innerText = 'Verifying handshake...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: savedEmail, code })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.style.color = '#4ade80';
                    messageDiv.innerText = '🎉 Handshake complete! You are officially on the waitlist.';
                    document.getElementById('step-code').classList.add('hidden');
                } else {
                    messageDiv.style.color = '#f87171';
                    messageDiv.innerText = data.error || 'Invalid code.';
                }
            } catch (err) {
                messageDiv.style.color = '#f87171';
                messageDiv.innerText = 'Connection error. Try again.';
            }
        }
    </script>
</body>
</html>
