<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launch Velocity | Zero-Trust Enterprise Vault</title>
  <style>
    :root {
      --bg-dark: #06090e;
      --panel-bg: #0f141d;
      --border-color: #1e293b;
      --border-glow: #38bdf8;
      --accent-blue: #38bdf8;
      --accent-cyan: #22d3ee;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #c084fc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15) 0%, transparent 65%),
        radial-gradient(circle at 90% 40%, rgba(192, 132, 252, 0.1) 0%, transparent 45%);
    }

    /* Top Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 36px;
      background: rgba(15, 20, 29, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      color: var(--text-main);
      text-transform: uppercase;
    }
    .brand-logo-icon {
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 0 10px var(--accent-cyan));
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 4px var(--accent-cyan)); transform: scale(1); }
      100% { filter: drop-shadow(0 0 16px var(--accent-blue)); transform: scale(1.03); }
    }

    /* Auth Stage Wrapper */
    .auth-stage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1;
      padding: 60px 20px;
      position: relative;
    }

    /* Multi-Node Hero Digital Art */
    .hero-illustration {
      width: 100%;
      max-width: 580px;
      height: 180px;
      margin-bottom: -30px;
      z-index: 1;
      pointer-events: none;
    }

    .auth-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.08);
      position: relative;
      z-index: 2;
      backdrop-filter: blur(12px);
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), transparent 50%, rgba(192, 132, 252, 0.25));
      z-index: -1;
      pointer-events: none;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.25s ease;
      letter-spacing: 0.04em;
    }
    .tab-btn.active {
      color: var(--accent-cyan);
      border-bottom-color: var(--accent-cyan);
    }

    /* Input Styling */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
    }
    .form-group label {
      font-size: 0.8rem;
      color: var(--accent-cyan);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper svg {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: #080c14;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.92rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.3);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: all 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .btn-primary { 
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan)); 
      color: #040914; 
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(56, 189, 248, 0.5);
    }
    .btn-success { background: var(--accent-green); color: #040914; }
    .btn-danger { background: var(--accent-red); color: #ffffff; }

    /* Dashboard Layout */
    .dashboard-stage {
      padding: 40px 32px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 28px;
    }
    .dashboard-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 28px;
      position: relative;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .dashboard-card:hover {
      border-color: var(--border-glow);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-illustration {
      width: 100%;
      height: 100px;
      margin-bottom: 18px;
      border-radius: 10px;
      background: rgba(8, 12, 20, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px dashed var(--border-color);
    }

    .hidden { display: none !important; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .badge-online { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .price-output {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--accent-green);
      margin-top: 8px;
      text-shadow: 0 0 12px rgba(34, 197, 94, 0.35);
    }
  </style>
</head>
<body>

  <!-- Top Navigation with Custom Logo Graphics -->
  <header class="navbar">
    <div class="brand-logo">
      <svg class="brand-logo-icon" viewBox="0 0 100 100">
        <polygon points="50,10 90,80 10,80" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linejoin="round"/>
        <polygon points="50,28 75,72 25,72" fill="#38bdf8" opacity="0.85"/>
        <circle cx="50" cy="54" r="8" fill="#ffffff"/>
      </svg>
      <span>Launch Velocity</span>
    </div>
    <div id="nav-user-info" class="hidden">
      <span id="display-username" style="color: var(--text-muted); margin-right: 16px; font-weight: 600;"></span>
      <button onclick="handleLogout()" class="btn btn-danger" style="width: auto; padding: 8px 18px;">Sign Out</button>
    </div>
  </header>

  <!-- STAGE 1: GATEKEEPER ENTRY WITH DIGITAL VECTOR ART -->
  <main id="stage-auth" class="auth-stage">
    
    <!-- Hero Digital Vector Artwork -->
    <svg class="hero-illustration" viewBox="0 0 600 180">
      <defs>
        <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8"
