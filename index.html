<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaunchVelocity — Tiers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 20px;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    h3 {
      margin-top: 0;
      font-size: 1.25rem;
      margin-bottom: 16px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, select, button {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      background: #2563eb;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <!-- Tier Selection Form -->
  <div class="card">
    <h3>Select Your Access Tier</h3>
    <form id="tierForm">
      <input type="email" id="userEmail" placeholder="Enter your email" required />
      
      <select id="tierLevel" required>
        <option value="1">Tier 1: Free Public Access / Waitlist</option>
        <option value="2">Tier 2: Basic Engagement</option>
        <option value="3">Tier 3: Standard Prosumer</option>
        <option value="4">Tier 4: Advanced Professional</option>
        <option value="5">Tier 5: Enterprise / VIP</option>
      </select>

      <button type="submit">Join / Upgrade</button>
    </form>
  </div>

  <!-- Verification Form -->
  <div class="card">
    <h3>Enter Verification Code</h3>
    <form id="verifyForm">
      <input type="email" id="verifyEmail" placeholder="Confirm your email" required />
      <input type="text" id="verifyCode" placeholder="6-digit code" required />
      
      <select id="confirmTierLevel" required>
        <option value="1">Tier 1</option>
        <option value="2">Tier 2</option>
        <option value="3">Tier 3</option>
        <option value="4">Tier 4</option>
        <option value="5">Tier 5</option>
      </select>

      <button type="submit">Verify & Activate Tier</button>
    </form>
  </div>

  <script>
    document.getElementById('tierForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('userEmail').value;
      const tierLevel = parseInt(document.getElementById('tierLevel').value);

      try {
        const response = await fetch('https://revenue-engine-dc8d.onrender.com/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, tierLevel })
        });
        const data = await response.json();
        if (data.success) {
          alert('Check your email for your verification code!');
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Network error connecting to backend.');
      }
    });

    document.getElementById('verifyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('verifyEmail').value;
      const code = document.getElementById('verifyCode').value;
      const tierLevel = parseInt(document.getElementById('confirmTierLevel').value);

      try {
        const response = await fetch('https://revenue-engine-dc8d.onrender.com/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code, tierLevel })
        });
        const data = await response.json();
        if (data.success) {
          alert('Success! Your account is verified and assigned to Tier ' + data.assignedTier);
        } else {
          alert('Verification failed: ' + data.error);
        }
      } catch (err) {
        alert('Network error connecting to backend.');
      }
    });
  </script>
</body>
</html>
