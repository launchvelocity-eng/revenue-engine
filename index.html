<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch Velocity | Enterprise Vault Portal</title>
  <style>
    :root {
      --bg-dark: #020617;
      --card-bg: rgba(10, 15, 28, 0.85);
      --border-cyan: rgba(34, 211, 238, 0.45);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --cyan-bright: #22d3ee;
      --cyan-glow: #06b6d4;
      --green-bright: #22c55e;
      --green-hover: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Fallback Cyber Background Gradient incase Canvas is loading */
    body {
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(6, 182, 212, 0.3) 0%, transparent 70%),
        linear-gradient(rgba(34, 211, 238, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.1) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
    }

    /* Fullscreen Canvas Overlay */
    #cyberMatrixCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Main Container */
    .portal-wrapper {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    /* Top Brand Header */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      width: 100%;
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      fill: #eab308;
      filter: drop-shadow(0 0 8px rgba(234, 179, 8, 0.6));
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #ffffff;
      text-transform: uppercase;
    }

    /* Glassmorphism Auth Card */
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-cyan);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 0 50px rgba(6, 182, 212, 0.25), 0 25px 50px -12px rgba(0, 0, 0, 0.95);
    }

    /* Tab Switcher */
    .tab-header {
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 24px;
      position: relative;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 0;
      cursor: pointer;
      transition: color 0.3s ease;
      text-align: center;
    }

    .tab-btn.active {
      color: var(--cyan-bright);
    }

    .tab-indicator {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 50%;
      height: 2px;
      background-color: var(--cyan-bright);
      box-shadow: 0 0 10px var(--cyan-bright);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--cyan-bright);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12
