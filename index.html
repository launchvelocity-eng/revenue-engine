<!-- Enterprise Waitlist & Onboarding Lead Flow -->
<section id="onboarding-section" class="cyber-panel">
  <div class="panel-header">
    <span class="cyber-badge">PRIORITY ACCESS</span>
    <h2>Secure Enterprise Onboarding</h2>
  </div>
  <p class="modal-subtext">
    Apply for a dedicated air-gapped vault enclave under our $2,500/mo baseline retainer tier (10 TB base capacity).
  </p>

  <form id="enterpriseOnboardForm" class="onboard-form">
    <div class="form-grid">
      <div class="input-group">
        <label for="companyName">CORPORATE ENTITY</label>
        <input type="text" id="companyName" placeholder="Acme Global Corp ($100M+)" required autocomplete="organization" />
      </div>

      <div class="input-group">
        <label for="adminEmail">ADMINISTRATIVE EMAIL</label>
        <input type="email" id="adminEmail" placeholder="security@acmeglobal.com" required autocomplete="email" />
      </div>
    </div>

    <div class="input-group">
      <label for="vaultTier">RETAINER TIER SELECTION</label>
      <select id="vaultTier" class="cyber-select">
        <option value="baseline">Baseline Enterprise Vault (10 TB Base — $2,500/mo)</option>
        <option value="custom">Custom Air-Gapped Cluster (Dedicated Node)</option>
      </select>
    </div>

    <button type="submit" class="btn-primary full-width">SUBMIT ENCLAVE APPLICATION</button>
    <div id="onboardStatusMessage" class="auth-status-msg"></div>
  </form>
</section>
