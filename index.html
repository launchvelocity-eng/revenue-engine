<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Velocity | Secure Enterprise Cloud Storage</title>
    <style>
        :root {
            --bg-primary: #070a13;
            --bg-card: #0d1322;
            --border-color: #1e293b;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--accent-blue);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #04060b;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-blue);
            color: #04060b;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        #status-message {
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
            line-height: 1.4;
        }

        .success { color: #34d399; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Launch Velocity</h1>
        <p class="subtitle">Secure enterprise cloud storage powered by zero-trust air-gapped architecture and automated lease lifecycles.</p>

        <form id="waitlist-form">
            <div class="form-group">
                <label for="company">Company Name</label>
                <input type="text" id="company" name="company" placeholder="Acme Corporation" required>
            </div>

            <div class="form-group">
                <label for="email">Corporate Email</label>
                <input type="email" id="email" name="email" placeholder="admin@acme.com" required>
            </div>

            <button type="submit" id="submit-btn">Request Partition Access</button>
        </form>

        <div id="status-message"></div>
    </div>

    <script>
        const form = document.getElementById('waitlist-form');
        const statusDiv = document.getElementById('status-message');
        const submitBtn = document.getElementById('submit-btn');

        // Point directly to your live Render backend endpoint
        const API_ENDPOINT = 'https://revenue-engine-dc8d.onrender.com/api/execute';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const company = document.getElementById('company').value;
            const email = document.getElementById('email').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Provisioning Partition...';
            statusDiv.textContent = '';

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ company, email })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusDiv.className = 'success';
                    statusDiv.innerHTML = `<strong>Success!</strong> Partition requested. Your secure Client Key ID has been dispatched to your corporate email.`;
                    form.reset();
                } else {
                    throw new Error(data.error || 'Server responded with a validation fault.');
                }
            } catch (err) {
                statusDiv.className = 'error';
                statusDiv.textContent = 'Error: ' + err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Request Partition Access';
            }
        });
    </script>
</body>
</html>
