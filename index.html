<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .card { background: #ffffff; max-width: 480px; margin: 0 auto; border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .title { color: #0b3c5d; font-size: 24px; font-weight: bold; margin-bottom: 12px; }
        .text { color: #4a5568; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
        .brand { font-size: 18px; color: #0969da; font-weight: bold; }
        .tagline { font-size: 12px; color: #319795; font-style: italic; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">You're on the list!</div>
        <div class="text">
            Hi! This confirmation is letting you know your sign up to our waiting list was successful. We will send an email verifying your sign up.
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <div style="font-size: 12px; color: #718096;">Powered by</div>
        <div class="brand">Launch Velocity</div>
        <div class="tagline">Igniting Innovation</div>
    </div>
</body>
</html>
