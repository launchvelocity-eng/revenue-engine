<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launch Velocity | Client Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
    }

    /* Gatekeeper Bar */
    .gatekeeper-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    .status-indicator { display: flex; align-items: center; gap: 12px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    .badge.locked { background: #490202; color: #ff8585; border: 1px solid #7a0000; }
    .badge.authenticated { background: #043821; color: #7ee787; border: 1px solid #116329; }
    .tenant-label { font-size: 0.85rem; color: #8b949e; }

    /* Telemetry Card */
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      max-width: 600px;
      margin: 0 auto 24px auto;
    }
    .card h3 { font-size: 1.2rem; color: #58a6ff; margin-bottom: 16px; }
    .status-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; }
    .status-badge.connecting { background: #21262d; color: #8b949e; }
    .status-badge.online { background: #043821; color: #7ee787; }
    .status-badge.error { background: #490202; color: #ff8585; }
    .telemetry-stats { list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 0.95rem; }

    /* Buttons */
    .btn { padding: 8px 16px; border-radius: 6px; border: none; font-size: 0.875rem; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #238636; color: #ffffff; }
    .btn-primary:hover { background: #2ea043; }
    .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .btn-secondary:hover { background: #30363d; }
    .btn-danger { background: #da3633; color: #ffffff; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(1, 4, 9, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.hidden { display: none; }
    .modal-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 12px; margin-bottom: 16px; }
    .modal-header h3 { color: #f0f6fc; font-size: 1.1rem; }
    .close-btn { background: none; border: none; color: #8b949e; font-size: 1.5rem; cursor: pointer; }
    .modal-description { font-size: 0.875rem; color: #8b949e; line-height: 1.4; margin-bottom: 16px; }
    .modal-description code { background: #0d1117; padding: 2px 6px; border-radius: 4px; color: #79c0ff; }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .form-group label { font-size: 0.85rem; color: #c9d1d9; font-weight: 500; }
    .form-group input { padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #f0f6fc; font-size: 0.9rem; }
    .form-group input:focus { outline: none; border-color: #58a6ff; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .feedback-msg { padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 16px; }
    .feedback-msg.success { background: #043821; color: #7ee787; }
    .feedback-msg.error { background: #490202; color: #ff8585; }
    .feedback-msg.hidden { display: none; }
  </style>
</head>
<body>

  <!-- Top Gatekeeper Bar -->
  <div id="gatekeeper-bar" class="gatekeeper-bar">
    <div class="status-indicator">
      <span id="gatekeeper-badge" class="badge locked">🔒 Gatekeeper Unauthenticated</span>
      <span id="active-tenant-display" class="tenant-label">Session Key: None</span>
    </div>
    <button id="open-auth-modal-btn" class="btn btn-secondary">Manage Vault Key</button>
  </div>
