<script>
  (function () {
    const STORAGE_KEY = 'X-Vault-Gatekeeper-Key';

    // DOM Elements
    const overlay = document.getElementById('auth-modal-overlay');
    const openBtn = document.getElementById('open-auth-modal-btn');
    const closeBtn = document.getElementById('close-auth-modal-btn');
    const form = document.getElementById('gatekeeper-form');
    const keyInput = document.getElementById('gatekeeper-key-input');
    const clearBtn = document.getElementById('clear-key-btn');
    const feedback = document.getElementById('auth-feedback');
    const badge = document.getElementById('gatekeeper-badge');
    const tenantDisplay = document.getElementById('active-tenant-display');

    // UI State Management
    function updateUIState() {
      const activeKey = sessionStorage.getItem(STORAGE_KEY);
      if (activeKey) {
        badge.textContent = '🔒 Gatekeeper Authenticated';
        badge.className = 'badge authenticated';
        const masked = activeKey.substring(0, 6) + '...' + activeKey.slice(-4);
        tenantDisplay.textContent = `Session Key: ${masked}`;
        keyInput.value = activeKey;
      } else {
        badge.textContent = '🔒 Gatekeeper Unauthenticated';
        badge.className = 'badge locked';
        tenantDisplay.textContent = 'Session Key: None';
        keyInput.value = '';
      }
    }

    // Modal Control
    openBtn.addEventListener('click', () => overlay.classList.remove('hidden'));
    closeBtn.addEventListener('click', () => overlay.classList.add('hidden'));
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.add('hidden');
    });

    // Save Credential
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = keyInput.value.trim();
      if (!val) return;

      sessionStorage.setItem(STORAGE_KEY, val);
      updateUIState();

      feedback.textContent = 'Gatekeeper key active for session.';
      feedback.className = 'feedback-msg success';
      feedback.classList.remove('hidden');

      setTimeout(() => {
        feedback.classList.add('hidden');
        overlay.classList.add('hidden');
      }, 1000);
    });

    // Clear Credential
    clearBtn.addEventListener('click', () => {
      sessionStorage.removeItem(STORAGE_KEY);
      updateUIState();
      feedback.textContent = 'Key cleared from browser memory.';
      feedback.className = 'feedback-msg error';
      feedback.classList.remove('hidden');

      setTimeout(() => feedback.classList.add('hidden'), 1500);
    });

    // Initialize UI on load
    updateUIState();

    // Helper function to perform authorized fetch requests
    window.secureVaultFetch = async function (url, options = {}) {
      const activeKey = sessionStorage.getItem(STORAGE_KEY);
      const headers = new Headers(options.headers || {});

      if (activeKey) {
        headers.set(STORAGE_KEY, activeKey);
      }

      return fetch(url, { ...options, headers });
    };
  })();
</script>
