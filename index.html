<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Velocity // Sovereign Enterprise Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --surface: rgba(15, 23, 42, 0.75);
            --surface-border: rgba(56, 189, 248, 0.15);
            --neon-cyan: #38bdf8;
            --neon-emerald: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Sovereign Circuit Grid Background */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: -1;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--surface-border);
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-emerald);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-emerald);
            animation: pulse 2s infinite;
        }

        .key-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--surface-border);
            color: var(--neon-cyan);
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
        }

        /* Main Dashboard Container */
        main {
            flex: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
