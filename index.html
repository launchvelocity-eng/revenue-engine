  <script>
    (function () {
      const ENGINE_URL = "https://revenue-engine-dc8d.onrender.com";

      // 1. 3D Wireframe Tunnel Canvas
      const canvas = document.getElementById("wireframe");
      const ctx = canvas ? canvas.getContext("2d") : null;
      let frame = 0;

      function drawTunnel() {
        if (!canvas || !ctx) return;
        const w = canvas.offsetWidth || window.innerWidth;
        const h = canvas.offsetHeight || 280;
        if (canvas.width !== w) canvas.width = w;
        if (canvas.height !== h) canvas.height = h;

        const cx = w / 2;
        const cy = h / 2;
        ctx.clearRect(0, 0, w, h);

        for (let i = 0; 14 > i; i += 1) {
          const p = ((i + frame * 0.015) % 14) / 14;
          const r = Math.pow(p, 1.8) * Math.max(cx, cy) * 1.4;
          ctx.beginPath();
          for (let s = 0; 8 >= s; s += 1) {
            const a = (s / 8) * Math.PI * 2 + p * 0.6;
            const x = cx + Math.cos(a) * r;
            const y = cy + Math.sin(a) * r;
            if (s === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = "rgba(56, 189, 248, " + (p * 0.55).toFixed(3) + ")";
          ctx.lineWidth = 1.4;
          ctx.stroke();
        }
        frame += 1;
        window.requestAnimationFrame(drawTunnel);
      }
      drawTunnel();

      // 2. Interactive Tier Switcher
      const TIERS = {
        starter: { price: "$199/mo", desc: "Starter Engine • Stripe Verified", used: "0.1", limit: "0.5" },
        growth: { price: "$499/mo", desc: "Growth Suite • Stripe Verified", used: "0.6", limit: "2.0" },
        enterprise: { price: "$999/mo", desc: "Enterprise Core • Stripe Verified", used: "1.2", limit: "5.0" }
      };

      const tierSelect = document.getElementById("tierSelect");
      if (tierSelect) {
        tierSelect.addEventListener("change", function (e) {
          const t = TIERS[e.target.value];
          if (!t) return;
          document.getElementById("tier-price").textContent = t.price;
          document.getElementById("tier-desc").textContent = t.desc;
          document.getElementById("vault-used").textContent = t.used;
          document.getElementById("vault-limit").textContent = t.limit;
        });
      }

      // 3. Live Stripe Checkout Session Trigger
      const checkoutBtn = document.getElementById("checkout-btn");
      if (checkoutBtn) {
        checkoutBtn.addEventListener("click", async function () {
          const tier = tierSelect ? tierSelect.value : "enterprise";
          checkoutBtn.textContent = "Initializing Stripe Checkout...";
          checkoutBtn.disabled = true;

          try {
            const res = await fetch(ENGINE_URL + "/api/v1/create-checkout-session", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-tenant-id": "enterprise-default"
              },
              body: JSON.stringify({ tier: tier })
            });
            const data = await res.json();
            if (data.url) {
              window.location.href = data.url;
            } else {
              throw new Error(data.error || "Checkout session unavailable");
            }
          } catch (err) {
            checkoutBtn.textContent = "Stripe Error: " + err.message;
            setTimeout(function () {
              checkoutBtn.textContent = "Activate / Manage Stripe Billing";
              checkoutBtn.disabled = false;
            }, 3000);
          }
        });
      }

      // 4. SHA-256 Vault Dropzone
      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("fileInput");
      const vaultLog = document.getElementById("vaultLog");

      if (dropzone && fileInput && vaultLog) {
        dropzone.addEventListener("click", function () { fileInput.click(); });
        fileInput.addEventListener("change", async function (e) {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          vaultLog.textContent = "Encrypting & hashing " + file.name + "...";
          try {
            const buffer = await file.arrayBuffer();
            const hashBuffer = await window.crypto.subtle.digest("SHA-256", buffer);
            const hashHex = Array.from(new Uint8Array(hashBuffer))
              .map(function (b) { return b.toString(16).padStart(2, "0"); })
              .join("");
            vaultLog.textContent = "VERIFIED: " + file.name + " (" + (file.size / 1024).toFixed(1) + " KB) | SHA-256: " + hashHex;
          } catch (err) {
            vaultLog.textContent = "QUEUED: " + file.name + " | Server-side SHA-256 pending";
          }
        });
      }

      // 5. Auto-Retry Telemetry Sync (handles Render 50s cold starts)
      async function syncTelemetry() {
        const badge = document.getElementById("node-badge");
        try {
          const res = await fetch(ENGINE_URL + "/api/v1/telemetry", {
            headers: { "Content-Type": "application/json", "x-tenant-id": "enterprise-default" }
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (badge) badge.textContent = "LIVE SYNC";
          document.querySelectorAll("[data-engine-sync]").forEach(function (el) {
            const k = el.getAttribute("data-engine-sync");
            if (k && data[k] !== undefined) el.textContent = String(data[k]);
          });
        } catch (err) {
          if (badge) badge.textContent = "WAKING NODE...";
          setTimeout(syncTelemetry, 5000);
        }
      }
      syncTelemetry();
    })();
  </script>
