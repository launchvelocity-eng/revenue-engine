<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launch Velocity // Sovereign Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background-color: #060b14;
      background-image:
        linear-gradient(to right, rgba(56, 189, 248, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
      background-size: 32px 32px;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .container { max-width: 520px; margin: 0 auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    .key-pill {
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(15, 23, 42, 0.75);
      padding: 6px 10px;
      border-radius: 8px;
      color: #7dd3fc;
      white-space: nowrap;
    }
    h1 { text-align: center; font-size: 32px; letter-spacing: 0.06em; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .card {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      font-weight: 600;
    }
