    :root {
      --bg-dark: #020617;
      --card-bg: rgba(10, 15, 28, 0.82);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;

      --cyan-glow: #06b6d4;

      --green-hover: #16a34a;

    * {

      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;

    /* Fullscreen Canvas Overlay */
    #cyberMatrixCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;

    .portal-wrapper {

      z-index: 1;
      min-height: 100vh;

      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 16px 40px;
    }

    }
