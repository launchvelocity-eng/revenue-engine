<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAUNCH VELOCITY // Secure Portal</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #040711;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
      overflow-x: hidden;
    }

    /* Fixed full-viewport hardware-accelerated graphic plane */
    #cyber-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Dark ambient viewport overlay to preserve form readability */
    .viewport-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, rgba(4, 7, 17, 0.4) 10%, rgba(4, 7, 17, 0.85) 80%);
      z-index: 1;
      pointer-events: none;
    }

    .brand-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 40px;
      margin-top: 20px;
    }
    .brand-logo {
      color: #ffb800;
      font-size: 24px;
    }
    .brand-title {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .portal-card {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 440px;
      background: rgba(13, 18, 28, 0.92);
      border: 1px solid #1f293d;
      border-radius: 12px;
      padding: 30px 24px;
      box-sizing: border-box;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 240, 255, 0.03);
      backdrop-filter: blur(10px);
    }

    .tab-header {
      display: flex;
      border-bottom: 1px solid #1f293d;
      margin-bottom: 25px;
    }
    .tab-btn {
      flex: 1;
      text-align: center;
      padding-bottom: 12px;
      color: #62728f;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s ease;
      user-select: none;
    }
    .tab-btn.active {
      color: #00f0ff;
      border-bottom: 2px solid #00f0ff;
    }

    .form-view {
      display: none;
    }
    .form-view.active {
      display: block;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #00f0ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      background: #090d16;
      border: 1px solid #1f293d;
      border-radius: 6px;
      padding: 12px;
      color: #ffffff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .form-input:focus {
      border-color: #00f0ff;
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 10px;
      transition: all 0.2s ease;
    }
    .btn-cyan {
      background: #00f0ff;
      color: #080c10;
    }
    .btn-green {
      background: #3fb950;
      color: #ffffff;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #1f293d;
      color: #62728f;
      margin-top: 14px;
    }
    .btn-secondary:hover {
      color: #ffffff;
      border-color: #384a6b;
    }
  </style>
</head>
<body>

  <!-- Background Graphics Layer -->
  <canvas id="cyber-canvas"></canvas>
  <div class="viewport-overlay"></div>

  
  <div class="brand-header">
    <span class="brand-logo">⚡</span>
    <span class="brand-title">Launch Velocity</span>
  </div>

  <!-- Gateway Card Component -->
  <div class="portal-card">
    <div class="tab-header">
      <div id="tab-signin" class="tab-btn active" onclick="PortalEngine.switchView('signin')">Sign In</div>
      <div id="tab-signup" class="tab-btn" onclick="PortalEngine.switchView('signup')">Sign Up</div>
    </div>

    <!-- Sign In Frame -->
    <div id="view-signin" class="form-view active">
      <form onsubmit="PortalEngine.executeSignIn(event)">
        <div class="form-group">
          <label class="form-label">Enterprise Username</label>
          <input type="text" id="signin-user" class="form-input" placeholder="corporate_admin" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="signin-pass" class="form-input" placeholder="••••••••••••" required>
        </div>
        <button type="submit" class="btn-action btn-cyan">Authenticate Vault Node</button>
      </form>
      <button class="btn-action btn-secondary" onclick="alert('Contact security administrator to reset encrypted access tokens.')">Forgot Username / Password?</button>
    </div>

    <!-- Sign Up Frame -->
    <div id="view-signup" class="form-view">
      <form onsubmit="PortalEngine.executeSignUp(event)">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" id="signup-first" class="form-input" placeholder="Alfredo" required>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" id="signup-last" class="form-input" placeholder="Monge" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Business / Corporation Name</label>
          <input type="text" id="signup-corp" class="form-input" placeholder="Launch Velocity Corp" required>
        </div>
        <div class="form-group">
          <label class="form-label">Enterprise Email</label>
          <input type="email" id="signup-email" class="form-input" placeholder="mongealfredoantonio@gmail.com" required>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Desired Username</label>
            <input type="text" id="signup-user" class="form-input" placeholder="monge_eng" required>
          </div>
          <div class="form-group">
            <label class="form-label">Secure Password</label>
            <input type="password" id="signup-pass" class="form-input" placeholder="••••••••••••" required>
          </div>
        </div>
        <button type="submit" class="btn-action btn-green">Register & Proceed to Sign In</button>
      </form>
    </div>
  </div>

  <script>
    // Live Digital Graphics Simulation Engine (Interactive Mesh Tunnel)
    const canvas = document.getElementById('cyber-canvas');
    const ctx = canvas.getContext('2d');
    
    let nodes = [];
    const maxNodes = 45;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class DataNode {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        // Explode outward from center to create your screenshot tunnel perspective depth
        this.angle = Math.random() * Math.PI * 2;
        this.speed = Math.random() * 2 + 0.5;
        this.radius = 0.1;
        this.colorIndex = Math.random();
      }
      update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.speed += 0.08; // Acceleration creates perspective movement
        this.radius += 0.04;
        
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        // Alternate cyan blue and green binary dots
        ctx.fillStyle = this.colorIndex > 0.4 ? 'rgba(0, 240, 255, 0.4)' : 'rgba(63, 185, 80, 0.3)';
        ctx.fill();
      }
    }

    for (let i = 0; i < maxNodes; i++) {
      nodes.push(new DataNode());
    }

    function animateGraphicsLoop() {
      ctx.fillStyle = 'rgba(4, 7, 17, 0.15)'; // Frame trailing creates matrix code stream effect
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw grid lines heading toward vanishing point center
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.02)';
      ctx.lineWidth = 1;
      const lines = 16;
      for(let i=0; i<lines; i++) {
        const angle = (i / lines) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(canvas.width/2, canvas.height/2);
        ctx.lineTo(canvas.width/2 + Math.cos(angle)*canvas.width, canvas.height/2 + Math.sin(angle)*canvas.height);
        ctx.stroke();
      }

      nodes.forEach(node => {
        node.update();
        node.draw();
      });
      requestAnimationFrame(animateGraphicsLoop);
    }
    animateGraphicsLoop();

    // Front-End View State Controller
    const PortalEngine = {
      cachedAccount: null,

      switchView(viewName) {
        document.querySelectorAll('.form-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        
        document.getElementById(`view-${viewName}`).classList.add('active');
        document.getElementById(`tab-${viewName}`).classList.add('active');
      },

      executeSignUp(e) {
        e.preventDefault();
