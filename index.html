<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaunchVelocity — Join the Waitlist</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 400px;
            padding: 2rem;
            background: #1e293b;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #475569;
            border-radius: 4px;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
        #response-message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>LaunchVelocity</h1>
        <p>Join the waitlist to get early access when we go live.</p>
        
        <form id="waitlist-form">
            <input type="email" id="email" placeholder="Enter your email address" required>
            <button type="submit">Join Waitlist</button>
        </form>
        
        <div id="response-message"></div>
    </div>

    <script>
        const form = document.getElementById('waitlist-form');
        const responseMessage = document.getElementById('response-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            responseMessage.style.color = '#cbd5e1';
            responseMessage.textContent = 'Submitting...';

            try {
                const response = await fetch('https://revenue-engine-dc8d.onrender.com/api/waitlist', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok) {
                    responseMessage.style.color = '#4ade80';
                    responseMessage.textContent = 'Success! You are on the waitlist.';
                    form.reset();
                } else {
                    responseMessage.style.color = '#f87171';
                    responseMessage.textContent = data.message || 'Something went wrong.';
                }
            } catch (error) {
                console.error('Error:', error);
                responseMessage.style.color = '#f87171';
                responseMessage.textContent = 'Network error. Please try again.';
            }
        });
    </script>

</body>
</html>
